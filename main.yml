- hosts: # Your IP here
  become: true
  tasks:
  - name: Install apache httpd (state=present is optional)
    ansible.builtin.apt:
      name: apache2
      state: present 
      update_cache: yes


  - name: Start service httpd, if not started
    ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

  - name: Add the user 'johnd' with a specific uid and a primary group of 'admin'
    ansible.builtin.user:
    name: johnd

  # - name: Add the user ann
  #   ansible.builtin.shell:
  #   cmd: sudo useradd ann -> using shell module is not idempotent, 
       #                       so it will run every time you run the playbook. 
       #                       Use the user module instead. it should be last resort

